name: Release

on:
  push:
    tags: ["*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # The conformance suite reads the shared corpus, which is fetched
      # rather than vendored. Missing here once already: the tests failed
      # loudly, which is what they are meant to do, and the release stopped.
      - name: Fetch the conformance corpus
        run: scripts/fetch-fixtures.sh


      - run: npm test

      - run: npm run build

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/main.js manifest.json --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
