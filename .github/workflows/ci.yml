name: CI

# The release workflow only runs on a tag, so until now nothing checked a
# pull request. Changes to ingest are exactly what wants a gate.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      # The corpus is shared with the other receivers and pinned to a tag,
      # so a new expectation lands when this repository adopts it rather
      # than the next time CI happens to run.
      - name: Fetch the conformance corpus
        run: scripts/fetch-fixtures.sh

      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      # Bundling is what the release does, so a bundle that cannot be built
      # should fail here rather than at tag time.
      - name: Build
        run: node esbuild.config.mjs production
